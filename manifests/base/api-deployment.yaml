apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-app-api
  labels:
    app.kubernetes.io/name: sandbox-app-api
    app.kubernetes.io/part-of: sandbox-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-app-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-app-api
        app.kubernetes.io/part-of: sandbox-app
    spec:
      containers:
        - name: api
          image: sandbox-app-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sandbox-app-api-config
            - secretRef:
                name: sandbox-app-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
