apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-app-web
  labels:
    app.kubernetes.io/name: sandbox-app-web
    app.kubernetes.io/part-of: sandbox-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-app-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-app-web
        app.kubernetes.io/part-of: sandbox-app
    spec:
      containers:
        - name: web
          image: sandbox-app-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sandbox-app-web-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
