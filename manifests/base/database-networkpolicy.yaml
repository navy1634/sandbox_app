apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-app-database
  labels:
    app.kubernetes.io/name: sandbox-app-database
    app.kubernetes.io/part-of: sandbox-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-app-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-app-api
      ports:
        - protocol: TCP
          port: 5432
